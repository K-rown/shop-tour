<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="t d">
  <title id="t">Hold still for two seconds</title>
  <desc id="d">A timeline: walking (blurry frames), then stopping and holding still for two seconds (one sharp frame), then walking on.</desc>
  <rect width="400" height="260" fill="#f4f1ea"/>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#222">
    <text x="200" y="28" text-anchor="middle" font-weight="700" font-size="19">stop, hold still, count to two</text>
  </g>
  <line x1="20" y1="150" x2="380" y2="150" stroke="#555" stroke-width="3"/>
  <g fill="#c9c2b0" stroke="#888" stroke-width="2">
    <rect x="26" y="80" width="56" height="42" rx="4" opacity=".55"/><rect x="34" y="84" width="56" height="42" rx="4" opacity=".55"/><rect x="42" y="88" width="56" height="42" rx="4" opacity=".55"/>
  </g>
  <rect x="150" y="76" width="100" height="62" rx="5" fill="#fff" stroke="#1a7a3c" stroke-width="4"/>
  <path d="M158 126 L184 100 L206 118 L224 98 L242 126 Z" fill="#9fb8a0"/>
  <g fill="#c9c2b0" stroke="#888" stroke-width="2">
    <rect x="300" y="80" width="56" height="42" rx="4" opacity=".55"/><rect x="308" y="84" width="56" height="42" rx="4" opacity=".55"/><rect x="316" y="88" width="56" height="42" rx="4" opacity=".55"/>
  </g>
  <rect x="150" y="146" width="100" height="10" fill="#1a7a3c"/>
  <g font-family="system-ui, sans-serif" font-size="17" fill="#222" text-anchor="middle">
    <text x="60" y="176">walking</text><text x="60" y="196" fill="#b3261e">blurry,</text><text x="60" y="216" fill="#b3261e">not used</text>
    <text x="200" y="176" font-weight="700" fill="#1a7a3c">2 seconds</text><text x="200" y="196">still and sharp:</text><text x="200" y="216">this one is used</text>
    <text x="340" y="176">walking on</text><text x="340" y="196" fill="#b3261e">blurry,</text><text x="340" y="216" fill="#b3261e">not used</text>
    <text x="200" y="248" font-size="15" fill="#555">count: one-one-thousand, two-one-thousand</text>
  </g>
</svg>
