<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-labelledby="t d">
  <title id="t">Stick straight up, camera overhead</title>
  <desc id="d">Left: the stick is vertical and the camera is directly above your head, 2.3 metres up. Right: the stick leans forward and the camera is off to the side, so you are seen from the side.</desc>
  <rect width="400" height="260" fill="#f4f1ea"/>
  <g font-family="system-ui, sans-serif" font-size="20" fill="#222">
    <text x="100" y="24" text-anchor="middle" font-weight="700" fill="#1a7a3c">RIGHT</text>
    <text x="300" y="24" text-anchor="middle" font-weight="700" fill="#b3261e">WRONG</text>
  </g>
  <line x1="200" y1="30" x2="200" y2="240" stroke="#bbb" stroke-dasharray="4 4"/>
  <line x1="10" y1="228" x2="190" y2="228" stroke="#555" stroke-width="3"/>
  <line x1="210" y1="228" x2="390" y2="228" stroke="#555" stroke-width="3"/>
  <g stroke="#222" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="100" cy="150" r="11" fill="#e8c9a0"/>
    <line x1="100" y1="161" x2="100" y2="200"/>
    <line x1="100" y1="200" x2="90" y2="228"/><line x1="100" y1="200" x2="110" y2="228"/>
    <line x1="100" y1="172" x2="106" y2="182"/>
    <line x1="100" y1="170" x2="90" y2="186"/>
    <line x1="106" y1="182" x2="106" y2="60" stroke="#7a5a20" stroke-width="4"/>
  </g>
  <rect x="99" y="42" width="14" height="18" rx="4" fill="#2b6cb0" stroke="#222" stroke-width="2"/>
  <path d="M106 60 L54 228 M106 60 L158 228" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <g font-family="system-ui, sans-serif" font-size="18" fill="#222">
    <text x="120" y="52">camera</text>
    <text x="118" y="112">stick</text>
    <text x="100" y="250" text-anchor="middle">you: small blob</text>
  </g>
  <path d="M30 56 L30 228" stroke="#555" stroke-width="1.5"/><path d="M25 56 L35 56 M25 228 L35 228" stroke="#555" stroke-width="1.5"/>
  <text x="38" y="46" font-family="system-ui, sans-serif" font-size="18" fill="#222" text-anchor="middle">2.3 m</text>
  <g stroke="#222" stroke-width="3" stroke-linecap="round" fill="none">
    <circle cx="270" cy="150" r="11" fill="#e8c9a0"/>
    <line x1="270" y1="161" x2="270" y2="200"/>
    <line x1="270" y1="200" x2="260" y2="228"/><line x1="270" y1="200" x2="280" y2="228"/>
    <line x1="270" y1="170" x2="288" y2="156"/>
    <line x1="270" y1="170" x2="258" y2="186"/>
    <line x1="288" y1="156" x2="340" y2="60" stroke="#7a5a20" stroke-width="4"/>
  </g>
  <rect x="333" y="42" width="14" height="18" rx="4" fill="#2b6cb0" stroke="#222" stroke-width="2" transform="rotate(28 340 51)"/>
  <path d="M340 60 L290 228 M340 60 L392 228" stroke="#2b6cb0" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
  <text x="300" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#222">seen from the side</text>
</svg>
